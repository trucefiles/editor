name: truce_calendar
description: Calendar documents for Truce (iCalendar, .ics), read, edited, merged and printed back block-exact; health entries and cycle predictions. Pure Dart, no UI.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  collection: ^1.19.1
  rrule: ^0.2.18
  timezone: ^0.11.2
  truce_core: any

dev_dependencies:
  test: ^1.31.0
  truce_lints: any
  truce_test_support: any
