name: truce_editor
description: Truce Editor app. UI on top of truce_core.
publish_to: none
resolution: workspace
version: 0.10.0+23

environment:
  sdk: ^3.13.0
  flutter: 3.47.7

dependencies:
  collection: ^1.19.1
  dbus: ^0.8.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  intl: ^0.20.3
  logging: ^1.3.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  pool: ^1.5.1
  tray_manager: ^0.8.0
  truce_core: any
  truce_document_editor: any
  truce_documents: any
  truce_folders: any
  truce_markdown: any
  truce_plain_folder: any
  truce_plain_text: any
  truce_syncthing: any
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  # The key robots super_editor's own tests use; already in its graph.
  flutter_test_robots: 0.0.24
  integration_test:
    sdk: flutter
  super_editor: 0.3.0-dev.52
  truce_editor_test_support: any
  truce_lints: any
  truce_test_support: any

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/inter/LICENSE.txt
    # The tray icon; the Flatpak installs the same file as the app icon.
    - linux/flatpak/io.github.trucefiles.editor-128.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
