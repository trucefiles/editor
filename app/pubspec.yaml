name: truce_editor
description: Truce Editor app. UI on top of truce_core.
publish_to: none
resolution: workspace
version: 0.3.0+3

environment:
  sdk: ^3.13.0
  flutter: 3.47.7

dependencies:
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_riverpod: ^3.4.3
  flutter_staggered_grid_view: ^0.7.0
  path_provider: ^2.1.6
  truce_core: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  truce_lints: any

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/inter/LICENSE.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
