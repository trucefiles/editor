name: truce_editor
description: Truce Editor app. UI on top of truce_core.
publish_to: none
resolution: workspace
version: 0.6.3+12

environment:
  sdk: ^3.13.0
  flutter: 3.47.7

dependencies:
  dbus: ^0.8.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_riverpod: ^3.4.3
  flutter_staggered_grid_view: ^0.7.0
  logging: ^1.3.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  pool: ^1.5.1
  tray_manager: ^0.7.0
  truce_core: any
  truce_syncthing: any
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  truce_lints: any
  truce_test_support: any

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/inter/LICENSE.txt
    # The tray icon; the Flatpak installs the same file as the app icon.
    - linux/flatpak/io.github.trucefiles.editor-128.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
