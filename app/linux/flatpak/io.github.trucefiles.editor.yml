# Wraps the Flutter Linux bundle that `flutter build linux --release` made
# beforehand. No network access; folders come through the file chooser portal.
id: io.github.trucefiles.editor
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: truce_editor
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
modules:
  - name: truce-editor
    buildsystem: simple
    # Flutter's release build is prebuilt and has no debug info to split off.
    build-options:
      no-debuginfo: true
    build-commands:
      - cp -r bundle /app/truce_editor
      - mkdir -p /app/bin
      - ln -s /app/truce_editor/truce_editor /app/bin/truce_editor
      - install -Dm644 io.github.trucefiles.editor.desktop -t /app/share/applications
      - install -Dm644 io.github.trucefiles.editor.metainfo.xml -t /app/share/metainfo
      - install -Dm644 io.github.trucefiles.editor.svg -t /app/share/icons/hicolor/scalable/apps
    sources:
      - type: dir
        path: ../../build/linux/x64/release/bundle
        dest: bundle
      - type: file
        path: io.github.trucefiles.editor.desktop
      - type: file
        path: io.github.trucefiles.editor.metainfo.xml
      - type: file
        path: io.github.trucefiles.editor.svg
