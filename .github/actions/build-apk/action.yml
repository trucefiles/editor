name: Build APK
description: >
  Builds the Android release APK. Signs it with the project key when
  ANDROID_KEYSTORE_PATH and ANDROID_KEYSTORE_PASSWORD are set, else with the
  debug key.

outputs:
  path:
    description: The built APK file.
    value: ${{ steps.apk.outputs.path }}

inputs:
  cache-native-builds:
    description: Reuse native libraries from earlier runs; never for releases.
    default: 'false'

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-flutter

    - if: inputs.cache-native-builds == 'true'
      uses: ./.github/actions/cache-native-builds
      with:
        build: apk

    - name: Get packages from the lock file
      shell: bash
      run: flutter pub get --enforce-lockfile

    - name: Build APK
      id: apk
      shell: bash
      working-directory: app
      run: |
        flutter build apk --release
        echo "path=$PWD/build/app/outputs/flutter-apk/app-release.apk" >> "$GITHUB_OUTPUT"
