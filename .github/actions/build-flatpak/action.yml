name: Build Flatpak
description: Builds the Linux app and wraps it in a Flatpak bundle file.

outputs:
  path:
    description: The built Flatpak bundle file.
    value: ${{ steps.bundle.outputs.path }}

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-flutter

    - name: Install Linux build tools
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends \
          ninja-build libgtk-3-dev flatpak flatpak-builder

    - name: Get packages from the lock file
      shell: bash
      run: flutter pub get --enforce-lockfile

    - name: Build Linux bundle
      shell: bash
      working-directory: app
      run: flutter build linux --release

    - name: Build Flatpak bundle
      id: bundle
      shell: bash
      env:
        APP_ID: io.github.trucefiles.editor
      run: |
        flatpak remote-add --user --if-not-exists flathub \
          https://dl.flathub.org/repo/flathub.flatpakrepo
        # Installs the runtime and SDK named in the manifest.
        flatpak-builder --user --install-deps-from=flathub \
          --disable-rofiles-fuse --force-clean \
          --state-dir="$RUNNER_TEMP/flatpak-state" \
          --repo="$RUNNER_TEMP/flatpak-repo" "$RUNNER_TEMP/flatpak-build" \
          "app/linux/flatpak/$APP_ID.yml"
        path="$RUNNER_TEMP/truce-editor.flatpak"
        flatpak build-bundle "$RUNNER_TEMP/flatpak-repo" "$path" "$APP_ID"
        echo "path=$path" >> "$GITHUB_OUTPUT"
