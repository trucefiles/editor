name: Build Flatpak
description: Builds the Linux app and wraps it in a Flatpak bundle file.

outputs:
  path:
    description: The built Flatpak bundle file.
    value: ${{ steps.bundle.outputs.path }}

inputs:
  cache-native-builds:
    description: Reuse native libraries from earlier runs; never for releases.
    default: 'false'

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-flutter

    - name: Install Linux build tools
      uses: ./.github/actions/install-linux-packages
      with:
        packages: ninja-build libgtk-3-dev flatpak flatpak-builder

    - if: inputs.cache-native-builds == 'true'
      uses: ./.github/actions/cache-native-builds
      with:
        build: flatpak

    - name: Get packages from the lock file
      shell: bash
      run: flutter pub get --enforce-lockfile

    - name: Build Linux bundle
      shell: bash
      working-directory: app
      run: flutter build linux --release

    - name: Build Flatpak bundle
      id: bundle
      shell: bash
      env:
        APP_ID: io.github.trucefiles.editor
      run: |
        flatpak remote-add --user --if-not-exists flathub \
          https://dl.flathub.org/repo/flathub.flatpakrepo
        # Installs the runtime and SDK named in the manifest.
        flatpak-builder --user --install-deps-from=flathub \
          --disable-rofiles-fuse --force-clean \
          --state-dir="$RUNNER_TEMP/flatpak-state" \
          --repo="$RUNNER_TEMP/flatpak-repo" "$RUNNER_TEMP/flatpak-build" \
          "app/linux/flatpak/$APP_ID.yml"
        path="$RUNNER_TEMP/truce-editor.flatpak"
        # The runtime repo lets `flatpak install` fetch the runtime itself.
        flatpak build-bundle \
          --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
          "$RUNNER_TEMP/flatpak-repo" "$path" "$APP_ID"
        echo "path=$path" >> "$GITHUB_OUTPUT"
