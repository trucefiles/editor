name: Set up Flutter
description: >
  Installs the pinned Flutter SDK, verified against its published SHA-256, and
  restores the SDK and the pub cache from earlier runs.

runs:
  using: composite
  steps:
    - name: Pin the Flutter version
      shell: bash
      # Update both together, from Flutter's releases_linux.json.
      run: |
        echo "FLUTTER_VERSION=3.47.7" >> "$GITHUB_ENV"
        echo "FLUTTER_SHA256=af7455f540df951184c7953fbe3cf884766e7541dacf8571f9f582db03dd6230" >> "$GITHUB_ENV"

    - name: Restore the Flutter SDK
      id: sdk
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/flutter
        key: flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ env.FLUTTER_SHA256 }}

    - name: Download, verify and unpack Flutter
      if: steps.sdk.outputs.cache-hit != 'true'
      shell: bash
      run: |
        archive="flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
        curl --fail --silent --show-error --location \
          --output "$RUNNER_TEMP/$archive" \
          "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/$archive"
        echo "$FLUTTER_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
        tar --extract --xz --file "$RUNNER_TEMP/$archive" --directory "$RUNNER_TEMP"

    - name: Put Flutter on the path
      shell: bash
      run: echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

    - name: Restore the pub cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.pub-cache
        key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
        restore-keys: pub-${{ runner.os }}-

    - name: Turn off analytics
      shell: bash
      run: flutter --disable-analytics
