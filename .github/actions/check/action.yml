name: Check
description: Checks formatting, analyzes, and runs the tests of every package.

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-flutter

    # Every Dart build compiles the tray's native code, which needs GTK.
    - uses: ./.github/actions/install-linux-packages
      with:
        packages: libgtk-3-dev

    - uses: ./.github/actions/cache-native-builds
      with:
        build: check

    - name: Get packages from the lock file
      shell: bash
      run: flutter pub get --enforce-lockfile

    - name: Check formatting
      shell: bash
      run: dart format --output=none --set-exit-if-changed .

    - name: Analyze
      shell: bash
      run: flutter analyze --fatal-infos

    - name: Test core
      shell: bash
      working-directory: core
      run: dart test

    - name: Test Markdown
      shell: bash
      working-directory: types/markdown/markdown
      run: dart test

    - name: Test plain text
      shell: bash
      working-directory: types/plain_text/plain_text
      run: dart test

    - name: Test calendar
      shell: bash
      working-directory: types/calendar/calendar
      run: dart test

    - name: Test Syncthing
      shell: bash
      working-directory: plugins/syncthing/syncthing
      run: dart test

    - name: Test local folder
      shell: bash
      working-directory: plugins/local_folder/local_folder
      run: dart test

    - name: Test folders
      shell: bash
      working-directory: folders
      run: dart test

    - name: Test files
      shell: bash
      working-directory: files
      run: dart test

    - name: Test masonry grid
      shell: bash
      working-directory: masonry
      run: flutter test

    - name: Test document editor
      shell: bash
      working-directory: types/document_editor
      run: flutter test

    - name: Test calendar editor
      shell: bash
      working-directory: types/calendar/calendar_editor
      run: flutter test

    - name: Test app
      shell: bash
      working-directory: app
      run: flutter test
