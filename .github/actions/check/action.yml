name: Check
description: Checks formatting, analyzes, and runs the core, Markdown, Syncthing and app tests.

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-flutter

    # Every Dart build compiles the tray's native code, which needs GTK.
    - uses: ./.github/actions/install-linux-packages
      with:
        packages: libgtk-3-dev

    - uses: ./.github/actions/cache-native-builds
      with:
        build: check

    - name: Get packages from the lock file
      shell: bash
      run: flutter pub get --enforce-lockfile

    - name: Check formatting
      shell: bash
      run: dart format --output=none --set-exit-if-changed .

    - name: Analyze
      shell: bash
      run: flutter analyze --fatal-infos

    - name: Test core
      shell: bash
      working-directory: core
      run: dart test

    - name: Test Markdown
      shell: bash
      working-directory: markdown
      run: dart test

    - name: Test Syncthing
      shell: bash
      working-directory: syncthing
      run: dart test

    - name: Test app
      shell: bash
      working-directory: app
      run: flutter test
