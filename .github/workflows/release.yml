name: Release

# Builds the signed APK and the Flatpak and publishes them as a GitHub Release
# for the pubspec version. Starts either from a pushed version tag (vX.Y.Z), or
# by hand on main ("Run workflow"), which creates the tag on publish. Only the
# publish job can write to the repository; only the Android job, in the
# "release" environment, can read the signing key. Nothing is built before
# the checks pass.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Work out the release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Take the tag from the pubspec version
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(sed -n 's/^version: \([^+]*\).*/\1/p' app/pubspec.yaml)"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::Start releases from main only"
              exit 1
            fi
            if lookup=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" 2>&1); then
              echo "::error::$tag already exists; raise the version in app/pubspec.yaml"
              exit 1
            elif ! grep -q 'HTTP 404' <<< "$lookup"; then
              echo "::error::Couldn't check whether $tag exists: $lookup"
              exit 1
            fi
          elif [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app version $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Check the release notes for the stores
        run: |
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' app/pubspec.yaml)
          build=$(sed -n 's/^version: [^+]*+\([0-9]*\)$/\1/p' app/pubspec.yaml)
          metainfo=app/linux/flatpak/io.github.trucefiles.editor.metainfo.xml
          notes=$(python3 -c '
          import sys, xml.etree.ElementTree as ET
          path, version = sys.argv[1:]
          release = ET.parse(path).find(f"releases/release[@version=\x27{version}\x27]")
          description = None if release is None else release.find("description")
          print("".join(description.itertext()).strip() if description is not None else "")
          ' "$metainfo" "$version")
          if [ -z "$notes" ]; then
            echo "::error::Add a <release> entry with a <description> for $version to $metainfo"
            exit 1
          fi
          changelog=fastlane/metadata/android/en-US/changelogs/$build.txt
          if [ -z "$build" ] || ! grep -q '[^[:space:]]' "$changelog" 2>/dev/null; then
            echo "::error::Add the release notes for build $build to $changelog"
            exit 1
          fi
          if [ "$(wc -m < "$changelog")" -gt 500 ]; then
            echo "::error::Shorten $changelog to 500 characters (store limit)"
            exit 1
          fi

  check:
    name: Format, analyze, test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/check

  android:
    name: Build signed APK
    needs: [version, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unpack signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
      - uses: ./.github/actions/build-apk
        id: apk
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - name: Check the APK is signed with the project key
        env:
          APK: ${{ steps.apk.outputs.path }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort --version-sort | tail -n 1)
          # The file uses keytool's format (AB:CD:...); apksigner prints abcd...
          expected=$(tr -d ':\n' < app/android/release-certificate-sha256.txt | tr 'A-F' 'a-f')
          certs=$("$apksigner" verify --print-certs "$APK")
          echo "$certs"
          # One line per signer and signature scheme; all must be our key.
          actual=$(sed -n 's/^.*Signer.* certificate SHA-256 digest: //p' <<< "$certs" | sort -u)
          if [ "$actual" != "$expected" ]; then
            echo "::error::APK certificate $actual is not the project key $expected"
            exit 1
          fi
          mkdir dist
          cp "$APK" "dist/truce-editor-$TAG.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk
          path: dist/
          if-no-files-found: error
          retention-days: 1

  flatpak:
    name: Build Flatpak
    needs: [version, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-flatpak
        id: flatpak
      - name: Name the bundle after the version
        env:
          FLATPAK: ${{ steps.flatpak.outputs.path }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          mkdir dist
          cp "$FLATPAK" "dist/truce-editor-$TAG.flatpak"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: [version, android, flatpak]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create release with checksums
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          sha256sum -- * > SHA256SUMS
          # Creates the tag on the built commit when it doesn't exist yet.
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Truce Editor $TAG" --generate-notes \
            -- *
