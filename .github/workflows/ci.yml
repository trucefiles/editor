name: CI

# Pull requests and merges to main run the checks and UI tests. Builds live
# in the Test build and Release workflows.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, analyze, test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/check

  ui-test-part:
    name: UI tests (Linux, part ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Flutter splits the tests over the parts.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      # Each run starts from the packages the last run downloaded and saves
      # its own, so a slow Ubuntu mirror costs time only for new versions.
      - name: Restore downloaded Linux packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ runner.os }}-${{ github.run_id }}
          restore-keys: apt-${{ runner.os }}-
      - name: Install Linux build tools, a virtual display and a session bus
        run: |
          archives="$RUNNER_TEMP/apt-archives"
          mkdir -p "$archives/partial"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            -o Dir::Cache::Archives="$archives" \
            ninja-build libgtk-3-dev xvfb dbus-daemon
          # Drops versions the mirror no longer has, so the cache stays small.
          sudo apt-get autoclean -o Dir::Cache::Archives="$archives"
          # apt leaves root-owned files; the cache saves as the runner user.
          sudo chown -R "$USER" "$archives"
      - name: Get packages from the lock file
        run: flutter pub get --enforce-lockfile
      # One file imports all UI test files, so the app is built and started
      # once. It is generated, so no test file can be left out.
      - name: Gather the UI tests into one file
        working-directory: app/integration_test
        run: |
          tests=$(find . -maxdepth 1 -name '*_test.dart' ! -name all_test.dart -printf '%f\n' | sort)
          {
            echo "import 'package:flutter_test/flutter_test.dart';"
            for test in $tests; do echo "import '$test' as ${test%.dart};"; done
            echo 'void main() {'
            for test in $tests; do echo "  group('${test%.dart}', ${test%.dart}.main);"; done
            echo '}'
          } > all_test.dart
          cat all_test.dart
      - name: Run the app's UI tests
        working-directory: app
        # The tray test needs a session bus.
        run: |
          dbus-run-session -- \
            xvfb-run --auto-servernum flutter test integration_test/all_test.dart -d linux \
              --total-shards 2 --shard-index ${{ matrix.shard }}

  # One stable check over all parts, so the required check needs no change
  # when the parts do.
  ui-test:
    name: UI tests (Linux)
    needs: ui-test-part
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check that every part passed
        env:
          RESULT: ${{ needs.ui-test-part.result }}
        run: test "$RESULT" = success
