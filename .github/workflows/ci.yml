name: CI

# Pull requests and merges to main run the checks and UI tests. Builds live
# in the Test build and Release workflows.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, analyze, test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/check

  ui-test:
    name: UI tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      - name: Install Linux build tools, a virtual display and a session bus
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            ninja-build libgtk-3-dev xvfb dbus-daemon
      - name: Get packages from the lock file
        run: flutter pub get --enforce-lockfile
      - name: Run the app's UI tests
        working-directory: app
        # The tray test needs a session bus. One run per file: on Linux,
        # Flutter fails to start the app for the second file of a run.
        run: |
          for test in integration_test/*_test.dart; do
            dbus-run-session -- \
              xvfb-run --auto-servernum flutter test "$test" -d linux
          done
