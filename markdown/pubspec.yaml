name: truce_markdown
description: Markdown documents for Truce, read into a doc tree, edited, and printed back block-exact. Pure Dart, no UI.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  characters: ^1.4.1
  collection: ^1.19.1
  html: ^0.15.7
  truce_core: any

dev_dependencies:
  test: ^1.31.0
  truce_lints: any
  truce_test_support: any
